version: '3.8'

services:
  # Base de datos MySQL
  db:
    image: mysql:8.0
    container_name: petworld-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_DATABASE:-inventory_sales_db}
      MYSQL_USER: ${DB_USER:-petworld}
      MYSQL_PASSWORD: ${DB_PASSWORD:-petworld123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - petworld-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: petworld-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-inventory_sales_db}
      DB_USER: ${DB_USER:-petworld}
      DB_PASSWORD: ${DB_PASSWORD:-petworld123}
      JWT_SECRET: ${JWT_SECRET:-cambiar_en_produccion_123}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - petworld-network

  # Frontend (Nginx + React build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    container_name: petworld-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - petworld-network

volumes:
  mysql_data:

networks:
  petworld-network:
    driver: bridge
